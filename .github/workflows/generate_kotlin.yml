name: Generate Kotlin Event Models & Open PR to Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Schema Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Kotlin Generator Script
        run: python generate_kotlin_events.py

      - name: Checkout Android Repo & Create PR
        env:
          TOKEN: ${{ secrets.AUTO_COMMIT_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTO_COMMIT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone https://x-access-token:${TOKEN}@github.com/ozantakir/AnalyticsAndroidExample.git android_repo
          
          # 1. Hedef dizini yeni :core:analytics modülüne yönlendir
          TARGET_DIR="android_repo/core/analytics/src/main/java/com/example/core/analytics/generated"
          
          # 2. Hedef klasör yoksa oluştur
          mkdir -p $TARGET_DIR
          
          # 3. Eski generated dosyalarını temizle
          rm -rf $TARGET_DIR/*
          
          # 4. Python script'inin ürettiği dosyaları kontrol et ve kopyala
          if [ -d "output/kotlin" ] && [ "$(ls -A output/kotlin/*.kt 2>/dev/null)" ]; then
            cp output/kotlin/*.kt $TARGET_DIR/
          else
            echo "HATA: output/kotlin/ dizininde .kt dosyası bulunamadı!"
            exit 1
          fi
          
          cd android_repo
          
          # Yeni bir branch açıp PR gönder
          BRANCH_NAME="auto/analytics-update-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: update generated analytics event models"
            git push origin $BRANCH_NAME
            
            gh pr create --repo ozantakir/AnalyticsAndroidExample \
                         --title "🤖 Auto: Analytics Event Models Güncellendi" \
                         --body "Bu PR Spec-Driven Analytics pipeline tarafından otomatik üretilmiştir." \
                         --head $BRANCH_NAME \
                         --base master
          else
            echo "Herhangi bir değişiklik yok, PR açılmadı."
          fi